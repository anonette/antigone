  prompt: |
    Jedna osoba je umrla nakon što je izvršila teroristički napad. Plašeći se nemira, vlasti su odbile da porodici predaju telo radi sahrane. Rođak može da se povinuje zabrani ili da telo tajno sahrani. Ako se povinuje, telo će ostati nesahranjeno i porodica neće moći da tuguje. Ako se ne povinuje, prekršiće zakon i mogu uslediti nemiri.

    Šta rođak treba da uradi?

